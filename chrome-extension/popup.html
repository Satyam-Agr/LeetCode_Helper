<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>LeetCode Template Generator</title>
    <link rel="stylesheet" href="styles/styles.css">
  </head>
  <body class="popup">
    <main>
      <h1>LeetCode Generator</h1>
      <p id="status" class="status">Checking current tab...</p>
      <dl id="details" class="details" hidden>
        <div>
          <dt>Problem</dt>
          <dd id="problem"></dd>
        </div>
        <div>
          <dt>Output</dt>
          <dd id="output"></dd>
        </div>
      </dl>
      <div class="actions">
        <button id="retry" type="button" hidden>Try Again</button>
      </div>
    </main>
    <script type="module" src="src/popup.js"></script>
  </body>
</html>
