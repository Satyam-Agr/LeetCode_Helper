<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>LeetCode Generator Settings</title>
    <link rel="stylesheet" href="styles/styles.css">
  </head>
  <body class="options">
    <main>
      <h1>Settings</h1>
      <p id="status" class="status">Loading settings...</p>
      <label>
        Settings JSON
        <textarea id="settings"></textarea>
      </label>
      <div class="actions">
        <button id="reload" type="button">Reload</button>
        <button id="save" type="button">Save</button>
      </div>
    </main>
    <script type="module" src="src/options.js"></script>
  </body>
</html>
